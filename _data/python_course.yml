page_info:
  title: "Python for Beginners"
  description: "From \"Hello World\" to Data Science. A structured journey into the world of Python."
  instructors:
    - name: "Dr. Sushil Sharma"
      icon: "fas fa-user-tie text-primary"
      class: "premium-gold"
    - name: "Satyam Tiwari"
      icon: "fas fa-user-graduate text-success"
  institution:
    name: "Jagiellonian University, Krakow"
    icon: "fas fa-university text-info"

stats:
  lectures: 8
  tutorials: 8
  weeks: 8

lectures:
  - id: "lec01"
    number: "01"
    title: "Introduction to Python"
    week: "Week 1"
    pdf_url: "/assets/Python_Page/Lectures/Lec-01.pdf"
    description: "Getting Started with Python Programming"
    topics_col1:
      - "Programming Languages Overview"
      - "Why Python? Key Features"
    topics_col2:
      - "Python Environment Setup"
      - "Hello World Program"
    key_concepts: "Interpreted vs Compiled languages, Interactive programming, OOP fundamentals"
    practice_links:
      - title: "W3Schools Intro"
        url: "https://www.w3schools.com/python/python_intro.asp"
      - title: "Real Python Installation"
        url: "https://realpython.com/installing-python/"

  - id: "lec02"
    number: "02"
    title: "Data Types and Strings"
    week: "Week 2"
    pdf_url: "/assets/Python_Page/Lectures/Lec-02.pdf"
    description: "Understanding Python's Core Data Structures"
    topics_col1:
      - "Variables & Naming Rules"
      - "Dynamic Typing"
      - "Strings: Indexing & Slicing"
    topics_col2:
      - "Numbers (int, float, complex)"
      - "Lists, Tuples, Dictionaries"
      - "Sets & Booleans"
    practice_links:
      - title: "W3Schools Strings"
        url: "https://www.w3schools.com/python/python_strings.asp"
      - title: "Real Python Data Types"
        url: "https://realpython.com/python-data-types/"

  - id: "lec03"
    number: "03"
    title: "Flow Control"
    week: "Week 3"
    pdf_url: "/assets/Python_Page/Lectures/Lec-03.pdf"
    description: "Program Logic and Decision Making"
    topics_col1:
      - "If / Elif / Else Statements"
      - "For Loops"
    topics_col2:
      - "While Loops"
      - "range(), enumerate(), zip()"
    practice_links:
      - title: "HackerRank If-Else"
        url: "https://www.hackerrank.com/challenges/py-if-else/problem"
      - title: "Real Python Flow Control"
        url: "https://realpython.com/python-conditional-statements/"

  - id: "lec04"
    number: "04"
    title: "Functions"
    week: "Week 4"
    pdf_url: "/assets/Python_Page/Lectures/Lec-04.pdf"
    description: "Modular Programming and Code Reusability"
    topics_col1:
      - "Defining Functions (def)"
      - "Parameters & Arguments"
    topics_col2:
      - "Return Values"
      - "*args and **kwargs"
    practice_links:
      - title: "HackerRank Functions"
        url: "https://www.hackerrank.com/challenges/write-a-function/problem"
      - title: "W3Schools Functions"
        url: "https://www.w3schools.com/python/python_functions.asp"

  - id: "lec05"
    number: "05"
    title: "File Handling and Modules"
    week: "Week 5"
    pdf_url: "/assets/Python_Page/Lectures/Lec-05.pdf"
    description: "Working with Files and External Libraries"
    topics_col1:
      - "File Operations (r, w, a)"
      - "Context Managers (with)"
    topics_col2:
      - "Importing Modules"
      - "PIP Package Manager"
    practice_links:
      - title: "Real Python File I/O"
        url: "https://realpython.com/read-write-files-python/"
      - title: "W3Schools Modules"
        url: "https://www.w3schools.com/python/python_modules.asp"

  - id: "lec06"
    number: "06"
    title: "Error Handling and Debugging"
    week: "Week 6"
    pdf_url: "/assets/Python_Page/Lectures/Lec-06.pdf"
    description: "Writing Robust Python Code"
    topics_col1:
      - "Try / Except Blocks"
      - "Finally Clause"
    topics_col2:
      - "Raising Exceptions"
      - "Debugging Techniques"
    practice_links:
      - title: "W3Schools Try/Except"
        url: "https://www.w3schools.com/python/python_try_except.asp"
      - title: "Real Python Exceptions"
        url: "https://realpython.com/python-exceptions/"

  - id: "lec07"
    number: "07"
    title: "NumPy, Pandas, and Matplotlib"
    week: "Week 7"
    pdf_url: "/assets/Python_Page/Lectures/Lec-07.pdf"
    description: "Introduction to Scientific Python"
    custom_layout: true
    blocks:
      - icon: "fas fa-cube"
        title: "NumPy"
        color: "primary"
        desc: "Numerical computing with arrays"
      - icon: "fas fa-table"
        title: "Pandas"
        color: "success"
        desc: "Data manipulation and analysis"
      - icon: "fas fa-chart-line"
        title: "Matplotlib"
        color: "warning"
        desc: "Data visualization"
    practice_links:
      - title: "Real Python NumPy"
        url: "https://realpython.com/numpy-tutorial/"
      - title: "Pandas Documentation"
        url: "https://pandas.pydata.org/pandas-docs/stable/user_guide/10min.html"

  - id: "lec08"
    number: "08"
    title: "Object-Oriented Programming & Statistics"
    week: "Week 8"
    pdf_url: "/assets/Python_Page/Lectures/Lec-08.pdf"
    description: "Advanced Python Concepts"
    topics_col1:
      - "Classes and Objects"
      - "Encapsulation"
      - "Inheritance"
    topics_col2:
      - "Polymorphism"
      - "Mean, Median, Mode"
      - "Variance & Std Dev"
    practice_links:
      - title: "Real Python OOP"
        url: "https://realpython.com/python3-object-oriented-programming/"
      - title: "Real Python Statistics"
        url: "https://realpython.com/python-statistics/"

