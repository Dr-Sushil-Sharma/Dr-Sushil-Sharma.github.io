# =============================================================
# TEACHING PAGE DATA
# Edit this file to update courses, students, and philosophy.
# =============================================================

intro: >
  My goal is to equip students with the critical thinking and technical
  skills necessary to excel in experimental physics, fostering an
  environment where theory meets practice.

# --- TEACHING PHILOSOPHY ---
philosophy:
  - title: Conceptual Understanding
    text: "Moving beyond rote memorization to deep, intuitive grasp of physics."
    icon: fas fa-lightbulb
    color: text-warning

  - title: Active Learning
    text: "Applying theory to practical problems through coding and simulation."
    icon: fas fa-laptop-code
    color: text-info

  - title: Inclusive Environment
    text: "A classroom where every voice is heard and inquiry is encouraged."
    icon: fas fa-users
    color: text-success

# --- COURSES ---
courses:
  - title: Python for Beginners
    icon: fab fa-python
    icon_color: text-primary
    description: >
      From first scripts to confident programming. Emphasizes hands-on
      experience using Jupyter Notebooks and real-world physics examples.
    course_link: /teaching/python/
    github: https://github.com/Official-Satyam-Tiwari/PythonCourseForBeginners

  - title: Geant4 Simulations
    icon: fas fa-project-diagram
    icon_color: text-danger
    description: "A tutorial series modeling particle physics scenarios. Key topics:"
    topics:
      - Geometry Setup & Primary Particles
      - Physics Lists & Scoring
      - Particle Transport Modeling

