# --- RECRUITMENT ---
recruitment:
  title: Join the Group
  text: >
    I am looking for motivated students interested in
    **particle detection, medical imaging, or fundamental physics**.
    If you have a background in physics and programming, please email me your
    **CV** and a brief **statement of interest**.

